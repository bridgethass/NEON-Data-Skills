# MkDocs site for NEON-Data-Skills tutorials.
# Build:   python mkdocs/build_docs.py && mkdocs serve -f mkdocs/mkdocs.yml
# docs/ is GENERATED by build_docs.py from tutorials/ + mkdocs/pages/ - do not edit it.
site_name: NEON Data Skills
site_description: Tutorials for working with NEON (National Ecological Observatory Network) data in R, Python and more.
site_url: https://bridgethass.github.io/NEON-Data-Skills/
repo_url: https://github.com/NEONScience/NEON-Data-Skills
repo_name: NEONScience/NEON-Data-Skills

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - tags

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/catalog-filter.js

validation:
  links:
    not_found: warn
    unrecognized_links: info
    anchors: info
